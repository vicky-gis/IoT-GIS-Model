<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>Smart City Sewer IoT - Cross-section Animation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04060d;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#d9f4ff;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));background:linear-gradient(180deg,#070c1c,#04060d);border-bottom:1px solid rgba(25,227,255,.18)}
  .hint{display:none;margin-left:auto;margin-right:10px;font-size:12px;color:#6f9bb8;letter-spacing:.04em;white-space:nowrap}
  .hint kbd{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;color:#bfeaff;background:rgba(25,227,255,.12);border:1px solid rgba(25,227,255,.35);border-bottom-width:2px;border-radius:5px;padding:3px 6px;margin:0 2px 0 8px}
  #stats{display:flex;gap:8px;padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));background:#050913;border-bottom:1px solid rgba(25,227,255,.12)}
  .stat{flex:1;min-width:0;padding:7px 10px;border-radius:12px;border:1px solid rgba(25,227,255,.22);background:rgba(25,227,255,.06)}
  .stat small{display:block;font-size:10px;letter-spacing:.12em;color:#6f9bb8;text-transform:uppercase;white-space:nowrap}
  .stat b{display:block;margin-top:3px;font:600 17px/1.1 ui-monospace,Menlo,Consolas,monospace;color:#e9fbff;white-space:nowrap;transition:color .3s}
  .stat.warn{border-color:rgba(255,77,109,.7);background:rgba(179,32,63,.22)}
  .stat.warn b{color:#ff9db0}
  #toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);max-width:calc(100% - 28px);padding:10px 16px;border-radius:999px;background:rgba(6,14,30,.92);border:1px solid rgba(25,227,255,.5);color:#d9f4ff;font-size:13px;line-height:1.3;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:4}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .btn:focus-visible{outline:2px solid #19e3ff;outline-offset:3px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .live{width:10px;height:10px;border-radius:50%;background:#5dff7a;box-shadow:0 0 0 0 rgba(93,255,122,.7);animation:livepulse 1.6s infinite;flex:none}
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(93,255,122,.7)}100%{box-shadow:0 0 0 12px rgba(93,255,122,0)}}
  .brand b{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:11px;color:#6f9bb8;letter-spacing:.08em;font-weight:400;text-transform:none;margin-top:2px}
  .chip{flex:none;font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;padding:8px 14px;border-radius:999px;border:1px solid;transition:all .3s}
  .chip.ok{color:#a8ffbd;border-color:rgba(93,255,122,.5);background:rgba(18,128,58,.3)}
  .chip.bad{color:#ffd0d9;border-color:rgba(255,77,109,.7);background:rgba(179,32,63,.45);animation:chipbad .8s ease-in-out infinite}
  @keyframes chipbad{50%{box-shadow:0 0 16px rgba(255,77,109,.7)}}
  #stage{position:relative;flex:1;min-height:0;background:linear-gradient(180deg,#04061a 0,#04061a 50%,#1a1422 50%,#1a1422 100%)}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  #dock{display:flex;gap:10px;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#060b18,#04060d);border-top:1px solid rgba(25,227,255,.18)}
  .btn{flex:1;max-width:128px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:11px 4px 10px;border-radius:16px;color:#d9f4ff;font:500 12px/1 system-ui,sans-serif;letter-spacing:.03em;border:1px solid rgba(25,227,255,.35);background:linear-gradient(160deg,rgba(25,227,255,.16),rgba(123,91,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .25s,background .25s,border-color .25s}
  .btn:hover{border-color:#19e3ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 18px rgba(25,227,255,.35)}
  .btn:active{transform:scale(.94)}
  .btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn span{white-space:nowrap}
  .btn.danger{color:#ffd9df;border-color:rgba(255,92,120,.6);background:linear-gradient(160deg,rgba(255,61,110,.3),rgba(255,160,60,.2))}
  .btn.danger:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 20px rgba(255,77,109,.5)}
  .btn.danger.on{background:linear-gradient(160deg,#ff3d6e,#ff8a3d);color:#fff;border-color:#ffb3c0;animation:btnpulse 1s ease-in-out infinite}
  @keyframes btnpulse{50%{box-shadow:0 0 24px rgba(255,77,109,.85)}}
  .btn.active{border-color:#19e3ff;background:linear-gradient(160deg,rgba(25,227,255,.38),rgba(123,91,255,.28));box-shadow:0 0 16px rgba(25,227,255,.4)}
  .btn.off{opacity:.55}
  .btn.mega{color:#ffe6cf;border-color:rgba(255,150,60,.7);background:linear-gradient(160deg,rgba(255,110,40,.36),rgba(255,40,110,.3))}
  .btn.mega:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 22px rgba(255,140,60,.55)}
  .btn.mega.on{background:linear-gradient(160deg,#ff6a1f,#ff2d6f);color:#fff;border-color:#ffc9a0;animation:btnpulse 1s ease-in-out infinite}
  .btn .l{display:none}
  #btnLabels[aria-pressed="false"]{opacity:.62}
  @media (min-width:760px){
    .btn{max-width:124px}
    .btn .s{display:none}
    .btn .l{display:inline}
    #dock{gap:14px}
    #top{padding-top:12px;padding-bottom:12px}
    .brand b{font-size:17px}
    .stat b{font-size:20px}
    .stat small{font-size:11px}
    #stats{padding-top:10px;padding-bottom:10px;gap:12px;justify-content:center}
    .stat{flex:none;width:210px}
  }
  @media (min-width:900px) and (hover:hover){
    .hint{display:block}
  }
  @media (max-width:380px){
    .btn{gap:5px;padding:9px 2px 8px;font-size:11px;border-radius:14px}
    .btn svg{width:20px;height:20px}
    #dock{gap:6px;padding-left:8px;padding-right:8px}
    .stat{padding:6px 8px}
    .stat b{font-size:15px}
    .chip{padding:7px 10px;font-size:11px}
    .brand small{display:none}
  }
  @media (max-height:520px) and (orientation:landscape){
    #app{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr}
    #top{grid-column:1/3;grid-row:1;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
    .brand small{display:none}
    .brand b{font-size:14px}
    #stats{grid-column:1/3;grid-row:2;padding-top:5px;padding-bottom:5px}
    .stat{padding:4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
    .stat b{margin-top:0;font-size:15px}
    #stage{grid-column:1;grid-row:3}
    #dock{grid-column:2;grid-row:3;display:grid;grid-template-columns:repeat(2,68px);align-content:start;gap:8px;padding:8px calc(8px + env(safe-area-inset-right)) 8px 8px;border-top:0;border-left:1px solid rgba(25,227,255,.18);overflow-y:auto}
    .btn{flex:none;width:auto;max-width:none;padding:8px 2px 7px;gap:4px;font-size:11px}
    .btn svg{width:20px;height:20px}
    #toast{bottom:8px}
  }
  .lite #laserGlow{display:none}
  @media (prefers-reduced-motion:reduce){
    .tw,.scan,.ping,.wifi,.ringg,.holo{animation-duration:8s}
    .live,.chip.bad,.btn.danger.on{animation:none}
  }
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .lane{animation:lane 1s linear infinite}
  @keyframes lane{to{stroke-dashoffset:-50}}
  .scan{animation:scan 3.2s linear infinite}
  @keyframes scan{from{transform:translateY(0)}to{transform:translateY(200px)}}
  .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(4.5);opacity:0}}
  .blink{animation:blink 1.2s steps(2,jump-none) infinite}
  @keyframes blink{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
  .wifi{animation:wifi 1.6s ease-in-out infinite;opacity:0}
  .wifi.w2{animation-delay:.25s}.wifi.w3{animation-delay:.5s}
  @keyframes wifi{0%{opacity:0}35%{opacity:1}70%{opacity:0}100%{opacity:0}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:rip 1.4s ease-out infinite}
  .ripple.r2{animation-delay:.7s}
  @keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  .cable{animation:cab 1.4s linear infinite}
  .cable.slow{animation-duration:2.4s}
  @keyframes cab{to{stroke-dashoffset:-30}}
  .beam{animation:beam .5s linear infinite}
  @keyframes beam{to{stroke-dashoffset:-16}}
  .holo{animation:holo 4s ease-in-out infinite}
  @keyframes holo{0%,100%{opacity:.88}50%{opacity:1}}
  .ringg{transform-box:fill-box;transform-origin:center;animation:ringg 1.8s ease-out infinite}
  @keyframes ringg{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="live"></span><div><b>Smart sewer IoT</b><small>Manhole MH-117 &middot; live telemetry</small></div></div>
    <div class="hint" aria-hidden="true"><kbd>Space</kbd>pause<kbd>O</kbd>overflow<kbd>M</kbd>mega<kbd>S</kbd>speed<kbd>L</kbd>labels<kbd>F</kbd>full</div>
    <div id="chip" class="chip ok" role="status" aria-live="polite">NORMAL</div>
  </header>

  <section id="stats" aria-label="Live readings">
    <div class="stat" id="stLevel"><small>Water level</small><b id="vLevel">0.54 m</b></div>
    <div class="stat" id="stGas"><small>H2S gas</small><b id="vGas">10 ppm</b></div>
    <div class="stat" id="stDist"><small>Sensor to water</small><b id="vDist">2.84 m</b></div>
  </section>

  <main id="stage">
<svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated cross-section of a smart city street with a hovering GIS dashboard and an IoT sensor inside a sewer manhole scanning wastewater level and toxic gas">
<title>Smart city sewer IoT cross-section</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04061a"/><stop offset=".55" stop-color="#1a0f3d"/><stop offset="1" stop-color="#4a1a56"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2d3d"/><stop offset="1" stop-color="#1a1422"/>
  </linearGradient>
  <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff6c8" stop-opacity=".8"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f8f93"/><stop offset="1" stop-color="#143e48"/>
  </linearGradient>
  <linearGradient id="holoG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19e3ff" stop-opacity=".02"/><stop offset="1" stop-color="#19e3ff" stop-opacity=".22"/>
  </linearGradient>
  <radialGradient id="gasG">
    <stop offset="0" stop-color="#8dff8a" stop-opacity=".8"/><stop offset=".6" stop-color="#3fdc5c" stop-opacity=".35"/><stop offset="1" stop-color="#2fd65a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lampG">
    <stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sensorG">
    <stop offset="0" stop-color="#19e3ff" stop-opacity=".5"/><stop offset="1" stop-color="#19e3ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <clipPath id="tunnelClip"><rect x="-600" y="618" width="2400" height="134"/></clipPath>
  <clipPath id="dashClip"><rect x="420" y="40" width="360" height="210" rx="6"/></clipPath>
  <clipPath id="chartClip"><rect x="622" y="120" width="132" height="54"/></clipPath>
</defs>

  <g clip-path="url(#dashClip)">

  function update(dt){

    var surf = wy + Math.sin(600*0.02 + t*2.2)*3.5 + Math.sin(600*0.055 - t*1.4)*2;

    ['laser','laserGlow','laserCore'].forEach(function(id){ $(id).setAttribute('y2', surf); });
    hit1.setAttribute('cy', surf); hit2.setAttribute('cy', surf); hitDot.setAttribute('cy', surf);
    distTxt.textContent = 'd = ' + ((surf - 418) / 100).toFixed(2) + ' m';
    laser.setAttribute('stroke', alert ? '#ff5a7a' : '#3aa0ff');
    laserGlow.setAttribute('stroke', alert ? '#ff3355' : '#2f8cff');

    if (sp > 0){
      var wv = Math.sin(t * 6) * 1.5;
      shaftG.setAttribute('opacity', '1');
      shaftRect.setAttribute('y', (shaftTop + 2 + wv).toFixed(1));
      shaftRect.setAttribute('height', Math.max(0, 618 - shaftTop - 2 - wv).toFixed(1));
      shaftTopLine.setAttribute('y', (shaftTop + wv).toFixed(1));
    } else { shaftG.setAttribute('opacity', '0'); }

    var gh = gp * (96 + 20 * Math.sin(t * 7));
    if (gp > 0){
      var hwT = 8 + gp * 12, wb = Math.sin(t * 9) * 4;
      lid.setAttribute('transform', 'translate(' + (gp * 18).toFixed(1) + ',' + (-gp * 34 - Math.abs(Math.sin(t * 9)) * 4 * gp).toFixed(1) + ') rotate(' + (gp * 16 + Math.sin(t * 12) * 2 * gp).toFixed(1) + ' 600 372)');
      geyser.setAttribute('opacity', '1');
      geyserCol.setAttribute('d', geyserPath(22, hwT, wb, gh));
      geyserCore.setAttribute('d', geyserPath(10, hwT * 0.45, wb * 0.6, gh * 0.92));
    } else {
      lid.setAttribute('transform', '');
      geyser.setAttribute('opacity', '0');
    }

    fl.D = 28 * Math.min(1, fp * 1.6);
    fl.reach = 60 + fp * 2400;
    if (fp > 0){
      var xs = [], ys = [];
      for (var fx = -600; fx <= 1800; fx += 20){
        var dep = floodAt(fx);
        if (dep > 0.4){
          var ww = (Math.sin(fx * 0.045 + t * 3) * 1.8 + Math.sin(fx * 0.02 - t * 2) * 1.2) * Math.min(1, dep / 6);
          xs.push(fx); ys.push(376 - dep + ww);
        }
      }
      if (xs.length > 1){
        var fb = 'M' + xs[0] + ' 377', ff = '';
        for (var q2 = 0; q2 < xs.length; q2++){
          fb += ' L' + xs[q2] + ' ' + ys[q2].toFixed(1);
          ff += (q2 === 0 ? 'M' : ' L') + xs[q2] + ' ' + ys[q2].toFixed(1);
        }
        floodBody.setAttribute('d', fb + ' L' + xs[xs.length - 1] + ' 377 Z');
        floodFoam.setAttribute('d', ff);
      }
    } else {
      floodBody.setAttribute('d', '');
      floodFoam.setAttribute('d', '');
    }

    if (gp > 0){
      dropAcc = Math.min(4, dropAcc + dt * 120 * gp);
      while (dropAcc >= 1 && drops.length < lim.drops){
        dropAcc -= 1;
        var side = Math.random() < 0.25;
        var sgn = Math.random() < 0.5 ? -1 : 1;
        var dx0 = side ? 600 + sgn * rnd(14, 26) : 600 + rnd(-9, 9);
        var dy0 = side ? 374 : 376 - gh + rnd(-4, 6);
        var dr0 = rnd(1.4, 3.4);
        var dc = el('circle', {cx:dx0, cy:dy0, r:dr0, opacity:.9}, dropLayer);
        drops.push({e:dc, x:dx0, y:dy0, vx: side ? sgn * rnd(80, 230) : rnd(-120, 120), vy: -(side ? rnd(60, 150) : rnd(40, 150)), life:0, max:0, mist:false, r:dr0});
      }
      mistAcc = Math.min(3, mistAcc + dt * 14 * gp);
      while (mistAcc >= 1 && drops.length < lim.drops + 30){
        mistAcc -= 1;
        var mx0 = 600 + rnd(-14, 14), my0 = 376 - gh, mr0 = rnd(9, 15);
        var mc = el('circle', {cx:mx0, cy:my0, r:mr0, fill:'#d8fffb', opacity:.25}, dropLayer);
        drops.push({e:mc, x:mx0, y:my0, vx:rnd(-12, 12), vy:0, life:0, max:rnd(0.9, 1.5), mist:true, r:mr0});
      }
    }
    for (var di = drops.length - 1; di >= 0; di--){
      var dr = drops[di], rm = false;
      dr.life += dt;
      if (dr.mist){
        dr.y -= 26 * dt; dr.x += dr.vx * dt; dr.r += dt * 10;
        dr.e.setAttribute('opacity', Math.max(0, 0.28 * (1 - dr.life / dr.max)).toFixed(2));
        if (dr.life >= dr.max) rm = true;
      } else {
        dr.vy += 520 * dt; dr.x += dr.vx * dt; dr.y += dr.vy * dt;
        var sy = 376 - floodAt(dr.x);
        if (dr.vy > 0 && dr.y >= sy - 1){
          rm = true;
          if (rings.length < 26 && Math.random() < 0.6){
            var re = el('ellipse', {cx:dr.x.toFixed(1), cy:sy.toFixed(1), rx:3, ry:.7}, ringLayer);
            rings.push({e:re, age:0});
          }
        }
      }
      if (rm){ dropLayer.removeChild(dr.e); drops.splice(di, 1); }
      else {
        dr.e.setAttribute('cx', dr.x.toFixed(1)); dr.e.setAttribute('cy', dr.y.toFixed(1));
        if (dr.mist) dr.e.setAttribute('r', dr.r.toFixed(1));
      }
    }
    for (var ri = rings.length - 1; ri >= 0; ri--){
      var rg = rings[ri];
      rg.age += dt;
      if (rg.age > 0.8){ ringLayer.removeChild(rg.e); rings.splice(ri, 1); continue; }
      var rr = 3 + rg.age * 55;
      rg.e.setAttribute('rx', rr.toFixed(1));
      rg.e.setAttribute('ry', (rr * 0.2).toFixed(1));
      rg.e.setAttribute('opacity', (1 - rg.age / 0.8).toFixed(2));
    }

    gasTimer -= dt;
    if (gasTimer <= 0){ spawnGas(); gasTimer = Math.max(0.05, (0.45 - gas * 0.38) * rnd(.6,1.4)); }
    for (var i = gasParts.length - 1; i >= 0; i--){
      var p = gasParts[i];
      p.life += dt;
      if (Math.abs(p.x - 600) < 120) p.vx += (600 - p.x) * 0.35 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.r += dt * 2.5;
      if (p.y < 632 && Math.abs(p.x - 600) > 26){ p.y = 632; p.vy = 0; p.vx += rnd(-8,8) * dt; }
      if (p.y < 632 && Math.abs(p.x - 600) <= 26){ p.vy = -26; p.vx *= 0.9; }
      var a = Math.min(1, p.life * 1.2) * Math.max(0, 1 - p.life / p.max);
      p.e.setAttribute('cx', p.x.toFixed(1));
      p.e.setAttribute('cy', p.y.toFixed(1));
      p.e.setAttribute('r', p.r.toFixed(1));
      p.e.setAttribute('opacity', (a * (0.35 + gas * 0.6)).toFixed(2));
      if (p.life >= p.max || p.y < 440){ gasLayer.removeChild(p.e); gasParts.splice(i,1); }
    }

    bubTimer -= dt;
    if (bubTimer <= 0){ spawnBubble(wy); bubTimer = 0.1; }
    for (var b = bubbles.length - 1; b >= 0; b--){
      var bb = bubbles[b];
      bb.y -= bb.vy * dt;
      bb.x += Math.sin(t * 3 + bb.ph) * 8 * dt;
      bb.e.setAttribute('cx', bb.x.toFixed(1));
      bb.e.setAttribute('cy', bb.y.toFixed(1));
      if (bb.y <= wy + 2){ bubbleLayer.removeChild(bb.e); bubbles.splice(b,1); }
    }

    dataTimer -= dt;
    if (dataTimer <= 0){ spawnData(); dataTimer = alert ? 0.07 : 0.14; }
    for (var j = dataParts.length - 1; j >= 0; j--){
      var q = dataParts[j];
      q.y -= q.speed * dt;
      var fade = q.y < 300 ? Math.max(0, (q.y - 252) / 48) : 1;
      q.e.setAttribute('y', q.y.toFixed(1));
      q.e.setAttribute('opacity', fade.toFixed(2));
      if (q.y < 254){ stream.removeChild(q.e); dataParts.splice(j,1); }
    }

    var cf = 1 - 0.88 * fp;
    for (var c = 0; c < cars.length; c++){
      var car = cars[c];
      car.x += car.dir * car.speed * cf * dt;
      if (car.dir > 0 && car.x > 1900) car.x = -700;
      if (car.dir < 0 && car.x < -700) car.x = 1900;
      car.bob = fp * Math.sin(t * 3 + c) * 2;
      placeCar(car);
    }
    for (var ci = 0; ci < clouds.length; ci++){
      var cl = clouds[ci];
      cl.x += cl.s * dt;
      if (cl.x > 1900) cl.x = -700;
      cl.g.setAttribute('transform', 'translate(' + cl.x.toFixed(1) + ',' + cl.y.toFixed(1) + ')');
    }
    for (var dj = 0; dj < drones.length; dj++){
      var dn = drones[dj];
      dn.x += dn.v * dt;
      if (dn.v > 0 && dn.x > 1900) dn.x = -700;
      if (dn.v < 0 && dn.x < -700) dn.x = 1900;
      dn.g.setAttribute('transform', 'translate(' + dn.x.toFixed(1) + ',' + (dn.y + Math.sin(t * 1.3 + dj) * 5).toFixed(1) + ')');
    }

    var fxT = (alert ? 0.06 + 0.05 * Math.sin(t * 6) : 0) + mp * 0.06;
    state.fx += (fxT - state.fx) * Math.min(1, dt * 4);
    alertFx.setAttribute('opacity', Math.max(0, state.fx).toFixed(3));

    histTimer -= dt;
    if (histTimer <= 0){
      histTimer = 0.25;
      state.history.push(lvl);
      if (state.history.length > 40) state.history.shift();
      var pts = [];
      for (var n = 0; n < state.history.length; n++){
        var hx = 622 + n * (132 / 39);
        var hy = 174 - Math.min(3.8, state.history[n]) / 3.8 * 54;
        pts.push(hx.toFixed(1) + ',' + hy.toFixed(1));
      }
      chartLine.setAttribute('points', pts.join(' '));
      chartLine.setAttribute('stroke', alert ? '#ff6a85' : '#5ee0ff');
    }

    textTimer -= dt;
    if (textTimer <= 0){
      textTimer = 0.2;
      lvlTxt.textContent = lvl.toFixed(2) + ' m';
      lvlTxt.setAttribute('fill', state.h > 98 ? '#ff8aa0' : '#e9fbff');
      vLevel.textContent = lvl.toFixed(2) + ' m';
      vGas.textContent = Math.round(ppm) + ' ppm';
      vDist.textContent = ((surf - 418) / 100).toFixed(2) + ' m';
      stLevel.classList.toggle('warn', state.h > 98);
      stGas.classList.toggle('warn', gas > 0.6);
      gasTxt.textContent = Math.round(ppm) + ' ppm';
      gasTxt.setAttribute('fill', gas > 0.6 ? '#ff8aa0' : '#9dffb0');
      gasBar.setAttribute('width', Math.min(132, ppm / 40 * 132).toFixed(1));
      gasBar.setAttribute('fill', gas > 0.6 ? '#ff4d6d' : (gas > 0.4 ? '#ffd34d' : '#5dff7a'));
      badge.setAttribute('fill', alert ? '#b3203f' : '#12803a');
      var lab = mp > 0.55 ? 'FLOOD' : (alert ? 'ALERT' : 'NORMAL');
      badgeTxt.textContent = lab;
      var pc = alert ? '#ff4d6d' : '#5dff7a';
      mapPin.setAttribute('fill', pc);
      mapPing.setAttribute('stroke', pc);
      gasRing.setAttribute('stroke', gas > 0.45 ? (alert ? '#ff4d6d' : '#8dff8a') : '#19e3ff');
      halo.setAttribute('r', 40 + Math.sin(t * 3) * 4);
      var wantCls = alert ? 'chip bad' : 'chip ok';
      if (chip.className !== wantCls || chip.textContent !== lab){ chip.className = wantCls; chip.textContent = lab; }
    }
  }

  var last = performance.now();
  var perf = {acc:0, n:0, checked:0};
  function enableLite(){
    document.documentElement.classList.add('lite');
    lim.gas = 45; lim.bub = 18; lim.drops = 70;
    showToast('Low-power mode on for smoother playback');
  }
  function frame(now){
    var raw = (now - last) / 1000;
    last = now;
    var dt = Math.min(0.05, raw);
    if (!state.paused){
      update(dt * state.speed);
      if (!document.hidden && raw < 0.5 && perf.checked < 2){
        perf.acc += raw; perf.n++;
        if (perf.n >= 90){
          if (perf.acc / perf.n > 0.034) enableLite();
          perf.checked++; perf.acc = 0; perf.n = 0;
        }
      }
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function(){ last = performance.now(); });
  update(0.016);
  requestAnimationFrame(frame);

  function applyAnimState(){
    if (!document.getAnimations) return;
    document.getAnimations().forEach(function(a){
      try {
        if (a.updatePlaybackRate) a.updatePlaybackRate(state.speed);
        if (state.paused) a.pause(); else a.play();
      } catch(e){}
    });
  }

  var icoPlay = '<polygon points="7,4 20,12 7,20"/>';
  var icoPause = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  var btnPause = $('btnPause'), btnOver = $('btnOver'), btnSpeed = $('btnSpeed');
  var btnLabels = $('btnLabels'), btnFull = $('btnFull');
  var btnMega = $('btnMega'), lblMegaS = $('lblMegaS'), lblMegaL = $('lblMegaL');

  function togglePause(){
    state.paused = !state.paused;
    $('icoPause').innerHTML = state.paused ? icoPlay : icoPause;
    $('lblPause').textContent = state.paused ? 'Play' : 'Pause';
    btnPause.setAttribute('aria-label', state.paused ? 'Play' : 'Pause');
    btnPause.classList.toggle('active', !state.paused);
    applyAnimState();
    showToast(state.paused ? 'Paused' : 'Playing');
  }

  function setOverUI(on){
    btnOver.classList.toggle('on', on);
    btnOver.setAttribute('aria-pressed', on ? 'true' : 'false');
    $('lblOver').textContent = on ? 'Stop' : 'Overflow';
  }
  function toggleOverflow(){
    if (state.paused) togglePause();
    if (state.overflow > 0){
      state.overflow = 0; setOverUI(false);
      showToast('Overflow stopped - readings returning to normal');
      return;
    }
    state.overflow = 12; setOverUI(true);
    showToast('Overflow simulated - water level and H2S rising');
  }
  setInterval(function(){
    if (state.overflow <= 0 && btnOver.classList.contains('on')) setOverUI(false);
  }, 400);

  var speeds = [1, 2, 0.5], si = 0;
  function cycleSpeed(){
    si = (si + 1) % speeds.length;
    state.speed = speeds[si];
    $('lblSpeed').textContent = 'Speed ' + state.speed + 'x';
    btnSpeed.classList.toggle('active', state.speed !== 1);
    applyAnimState();
    showToast('Speed ' + state.speed + 'x');
  }

  function toggleLabels(){
    var hidden = labels.style.display === 'none';
    labels.style.display = hidden ? '' : 'none';
    btnLabels.classList.toggle('active', hidden);
    btnLabels.setAttribute('aria-pressed', hidden ? 'true' : 'false');
  }

  var canFull = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (!canFull) btnFull.style.display = 'none';
  function toggleFull(){
    if (!canFull) return;
    var de = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement){
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
      }
    } catch(e){}
  }

  function setMegaUI(on){
    btnMega.classList.toggle('on', on);
    btnMega.setAttribute('aria-pressed', on ? 'true' : 'false');
    lblMegaS.textContent = on ? 'Stop' : 'Mega';
    lblMegaL.textContent = on ? 'Stop flood' : 'Mega flood';
  }
  function toggleMega(){
    if (state.paused) togglePause();
    if (state.mega > 0){
      state.mega = 0; setMegaUI(false);
      showToast('Flood receding');
      return;
    }
    state.mega = 30; setMegaUI(true);
    showToast('Mega overflow: pipe filling, the manhole will burst onto the road');
  }
  setInterval(function(){
    if (state.mega <= 0 && btnMega.classList.contains('on')) setMegaUI(false);
  }, 400);

  btnMega.addEventListener('click', toggleMega);
  btnPause.addEventListener('click', togglePause);
  btnOver.addEventListener('click', toggleOverflow);
  btnSpeed.addEventListener('click', cycleSpeed);
  btnLabels.addEventListener('click', toggleLabels);
  btnFull.addEventListener('click', toggleFull);

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = (e.key || '').toLowerCase();
    if (k === ' ' || k === 'spacebar' || k === 'p'){ e.preventDefault(); if (!e.repeat) togglePause(); }
    else if (k === 'o'){ if (!e.repeat) toggleOverflow(); }
    else if (k === 'm'){ if (!e.repeat) toggleMega(); }
    else if (k === 's'){ if (!e.repeat) cycleSpeed(); }
    else if (k === 'l'){ if (!e.repeat) toggleLabels(); }
    else if (k === 'f'){ if (!e.repeat) toggleFull(); }
  });
  document.addEventListener('keyup', function(e){
    if (e.key === ' ' || e.key === 'Spacebar') e.preventDefault();
  });

  var touchMode = window.matchMedia && window.matchMedia('(hover: none)').matches;
  setTimeout(function(){
    showToast(touchMode ? 'Tip: tap Overflow to trigger the alert' : 'Tip: press O to trigger the overflow alert');
  }, 900);
})();
</script>
</body>
</html>
